name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# PERMISSIONS : Essentiel pour le Job de push vers GHCR
permissions:
  contents: read
  packages: write  # Autorise l'écriture dans le GitHub Container Registry

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        # Navigue vers le répertoire de l'application
        cd session2/ml-app
        python -m pip install --upgrade pip
        # Installer les dépendances nécessaires manuellement
        pip install flake8 pytest pandas scikit-learn joblib

    - name: Run Flake8 linter
      run: |
        # Navigue vers le répertoire de l'application
        cd session2/ml-app
        flake8 src tests

    - name: Run Pytest and generate XML report
      run: |
        # Navigue vers le répertoire de l'application
        cd session2/ml-app
        pytest tests/test_model.py --junitxml=test-results.xml

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results
        # Le chemin de l'artefact doit être relatif à la racine du dépôt
        path: ml-app/test-results.xml
        retention-days: 5

    - name: Build Docker Image
      id: docker_build
      run: |
        # Build Docker : l'application est dans le sous-dossier session2/ml-app
        docker build -t iris-classifier:latest session2/ml-app/.

    - name: Export Docker Image Artifact
      run: |
        docker save iris-classifier:latest -o iris-classifier.tar

    - name: Upload Docker Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-artifact
        path: iris-classifier.tar
        retention-days: 5
        
  push_image:
    runs-on: ubuntu-latest
    # DÉPENDANCE : Attend le succès de build_and_test
    needs: build_and_test 
    # Condition : Ne s'exécute que sur un push vers la branche main
    if: github.event_name == 'push'

    steps:
    - name: Set Repository Variables
      run: |
        echo "REPOSITORY=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Download Docker Image Artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image-artifact
        path: /tmp/

    - name: Load Docker Image
      run: |
        docker load -i /tmp/iris-classifier.tar

    - name: Login to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} 

    - name: Tag and Push Image to GHCR
      run: |
        IMAGE_NAME="ghcr.io/${{ env.REPOSITORY }}/iris-classifier"
        
        # Tag avec "latest" et le short SHA
        docker tag iris-classifier:latest $IMAGE_NAME:latest
        docker tag iris-classifier:latest $IMAGE_NAME:${{ env.IMAGE_TAG }}
        
        # Pousse les deux tags
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:${{ env.IMAGE_TAG }}
        
        echo "Image pushed successfully to GHCR: $IMAGE_NAME"