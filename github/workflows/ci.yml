name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pandas scikit-learn joblib
        # Note: Dependencies are listed explicitly for simplicity,
        # but in a real project, you'd use pip install -r requirements.txt

    - name: Run Flake8 linter
      run: |
        # Use the config file (.flake8) to exclude venv and set line length
        flake8 src tests

    - name: Run Pytest and generate XML report
      run: |
        pytest tests/test_model.py --junitxml=test-results.xml

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results
        path: test-results.xml
        retention-days: 5

    - name: Build Docker Image
      id: docker_build
      run: |
        docker build -t iris-classifier:latest .

    - name: Export Docker Image Artifact
      # This step saves the built Docker image as a tar archive
      # so it can be used or uploaded in subsequent steps/jobs if needed.
      run: |
        docker save iris-classifier:latest -o iris-classifier.tar

    - name: Upload Docker Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-artifact
        path: iris-classifier.tar
        retention-days: 5