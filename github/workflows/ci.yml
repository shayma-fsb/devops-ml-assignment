name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------
  # 1) JOB : BUILD + TEST + BUILD DOCKER IMAGE
  # ---------------------------------------------------------
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pandas scikit-learn joblib

    - name: Run Flake8 linter
      run: |
        flake8 src tests

    - name: Run Pytest and generate XML report
      run: |
        pytest tests/test_model.py --junitxml=test-results.xml

    - name: Upload Test Results Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results
        path: test-results.xml
        retention-days: 5

    - name: Build Docker Image
      run: |
        docker build -t iris-classifier:latest .

    - name: Export Docker Image Artifact
      run: |
        docker save iris-classifier:latest -o iris-classifier.tar

    - name: Upload Docker Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-artifact
        path: iris-classifier.tar
        retention-days: 5

  # ---------------------------------------------------------
  # 2) JOB : PUSH DOCKER IMAGE (ATTEND build_and_test)
  # ---------------------------------------------------------
  push_image:
    needs: build_and_test    # << OBLIGE build_and_test à réussir avant
    runs-on: ubuntu-latest

    steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image-artifact
        path: .

    - name: Load Docker Image
      run: |
        docker load -i iris-classifier.tar

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag Docker Image
      run: |
        docker tag iris-classifier:latest ${{ secrets.DOCKER_USERNAME }}/iris-classifier:latest

    - name: Push Docker Image to DockerHub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/iris-classifier:latest
